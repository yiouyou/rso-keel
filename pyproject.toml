[project]
name = "rso-keel"
version = "0.1.0"
description = "RSO-Keel — governance, provenance, and accountability contracts for high-responsibility AI workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=5.0.0",
    "import-linter>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "strict"
markers = [
    "asyncio: async test using pytest-asyncio",
]

[tool.importlinter]
root_packages = ["keel"]

[[tool.importlinter.contracts]]
name = "keel must not import platform code"
type = "forbidden"
source_modules = ["keel"]
forbidden_modules = [
    "app",
    "backend",
]
